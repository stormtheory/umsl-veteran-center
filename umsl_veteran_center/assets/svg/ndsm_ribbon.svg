<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 44" width="90" height="44">
  <!--
    National Defense Service Medal ribbon bar
    Official stripe specification (from DoD regulation):
      7/16" Scarlet 67111
      1/32" White 67101
      1/32" Old Glory Blue 67178
      1/32" White 67101
      1/32" Scarlet 67111
      center ~3/16" Golden Yellow 67104
      1/32" Scarlet 67111
      1/32" White 67101
      1/32" Old Glory Blue 67178
      1/32" White 67101
      7/16" Scarlet 67111
    Total width 1 3/8 inches
    Proportions mapped to 90px viewBox width
  -->
  <defs>
    <linearGradient id="ndsm" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- Left wide Scarlet: 7/16 of 1-3/8 = ~32% -->
      <stop offset="0%"    stop-color="#C10000"/>
      <stop offset="31.8%" stop-color="#C10000"/>
      <!-- White pinstripe 1/32 = ~2.3% -->
      <stop offset="31.8%" stop-color="#F0F0F0"/>
      <stop offset="34.1%" stop-color="#F0F0F0"/>
      <!-- Old Glory Blue pinstripe 1/32 -->
      <stop offset="34.1%" stop-color="#002868"/>
      <stop offset="36.4%" stop-color="#002868"/>
      <!-- White pinstripe 1/32 -->
      <stop offset="36.4%" stop-color="#F0F0F0"/>
      <stop offset="38.6%" stop-color="#F0F0F0"/>
      <!-- Scarlet pinstripe 1/32 -->
      <stop offset="38.6%" stop-color="#C10000"/>
      <stop offset="40.9%" stop-color="#C10000"/>
      <!-- Golden Yellow center stripe ~3/16 of total = ~18% -->
      <stop offset="40.9%" stop-color="#D4A012"/>
      <stop offset="59.1%" stop-color="#D4A012"/>
      <!-- Mirror right: Scarlet pinstripe -->
      <stop offset="59.1%" stop-color="#C10000"/>
      <stop offset="61.4%" stop-color="#C10000"/>
      <!-- White pinstripe -->
      <stop offset="61.4%" stop-color="#F0F0F0"/>
      <stop offset="63.6%" stop-color="#F0F0F0"/>
      <!-- Old Glory Blue pinstripe -->
      <stop offset="63.6%" stop-color="#002868"/>
      <stop offset="65.9%" stop-color="#002868"/>
      <!-- White pinstripe -->
      <stop offset="65.9%" stop-color="#F0F0F0"/>
      <stop offset="68.2%" stop-color="#F0F0F0"/>
      <!-- Right wide Scarlet 7/16 -->
      <stop offset="68.2%" stop-color="#C10000"/>
      <stop offset="100%"  stop-color="#C10000"/>
    </linearGradient>
  </defs>
  <!-- Ribbon body -->
  <rect x="0" y="0" width="90" height="44" fill="url(#ndsm)"/>
  <!-- Subtle silk sheen line across top third -->
  <rect x="0" y="0" width="90" height="10" fill="white" opacity="0.06"/>
</svg>
